<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت عادات و وظایف</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .scroll-smooth { -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">🎯 عادات من (شهریور)</h1>
      <button onclick="fetchHabits()" class="text-sm bg-indigo-700 px-3 py-1 rounded">بروزرسانی</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- وضعیت لودینگ <--
    <div id="loading" class="text-center py-6 text-gray-500">در حال دریافت اطلاعات از گوگل‌شیت...</div>

    <!-- لیست عادات <--
    <div id="habits-container" class="space-y-3"></div>
  </main>

  <script>
    // آدرس وب‌اپ گوگل اسکریپت خود را اینجا قرار دهید:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCpPtB3syUqNwCsvXIOJ1nGntFXBmnca1ruoqbcuVXCrGxSyi9oeIjLoyaAXRbyq7mDA/exec";

    async function fetchHabits() {
      document.getElementById('loading').style.display = 'block';
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getHabits&sheetName=عادات - شهریور`);
        const data = await res.json();
        renderHabits(data.habits || []);
      } catch (e) {
        alert("خطا در برقراری ارتباط با گوگل‌شیت");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderHabits(habits) {
      const container = document.getElementById('habits-container');
      container.innerHTML = "";
      
      const today = new Date().getDate(); // یا روز جاری شمسی

      habits.forEach(habit => {
        const isDoneToday = habit.days[today] || false;
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow flex items-center justify-between border-r-4 border-indigo-500";
        card.innerHTML = `
          <div>
            <h3 class="font-semibold text-gray-800">${habit.title}</h3>
            <span class="text-xs text-gray-400">هدف ماهانه: ${habit.target} بار</span>
          </div>
          <button onclick="toggleDay(${habit.id}, ${today}, this)" class="w-10 h-10 rounded-full flex items-center justify-center transition-colors ${isDoneToday ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-400'}">
            ✓
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function toggleDay(row, day, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "toggleHabitDay",
            sheetName: "عادات - شهریور",
            row: row,
            day: day
          })
        });
        const result = await res.json();
        if (result.success) {
          if (result.newValue) {
            btn.className = "w-10 h-10 rounded-full flex items-center justify-center bg-green-500 text-white";
          } else {
            btn.className = "w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 text-gray-400";
          }
        }
      } catch (e) {
        alert("خطا در ذخیره‌سازی");
      } finally {
        btn.disabled = false;
      }
    }

    // ثبت Service Worker برای قابلیت PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    fetchHabits();
  </script>
</body>
</html>
