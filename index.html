<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت عادات و وظایف</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-16">

  <!-- هدر اپلیکیشن به همراه سلکتور برگه -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto space-y-3">
      <div class="flex justify-between items-center">
        <h1 class="text-base font-bold">🎯 ردیاب هوشمند</h1>
        <button onclick="loadCurrentView()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg transition-colors">
          بروزرسانی
        </button>
      </div>

      <!-- منوی کشویی انتخاب برگه شیت -->
      <div class="flex items-center space-x-2 space-x-reverse">
        <label for="sheetSelector" class="text-xs text-indigo-200">برگه:</label>
        <select id="sheetSelector" onchange="onSheetChange()" class="w-full bg-indigo-700 text-white text-xs rounded-lg p-2 border border-indigo-500 focus:outline-none focus:ring-2 focus:ring-white">
          <option value="عادات - شهریور یگانه">عادات - شهریور یگانه</option>
          <option value="عادات - شهریور">عادات - شهریور (عمومی)</option>
          <option value="لیست کارها">لیست کارها (To-Do)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="loading" class="text-center py-6 text-sm text-gray-500">در حال دریافت اطلاعات...</div>

    <!-- کانتینر نمایش عادات -->
    <div id="habits-container" class="space-y-3"></div>

    <!-- کانتینر نمایش لیست کارها -->
    <div id="todos-container" class="space-y-3 hidden"></div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCpPtB3syUqNwCsvXIOJ1nGntFXBmnca1ruoqbcuVXCrGxSyi9oeIjLoyaAXRbyq7mDA/exec";
    let currentSelectedSheet = "عادات - شهریور یگانه";

    function onSheetChange() {
      currentSelectedSheet = document.getElementById('sheetSelector').value;
      loadCurrentView();
    }

    function loadCurrentView() {
      if (currentSelectedSheet === "لیست کارها") {
        document.getElementById('habits-container').classList.add('hidden');
        document.getElementById('todos-container').classList.remove('hidden');
        fetchTodos();
      } else {
        document.getElementById('todos-container').classList.add('hidden');
        document.getElementById('habits-container').classList.remove('hidden');
        fetchHabits(currentSelectedSheet);
      }
    }

    async function fetchHabits(sheetName) {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('habits-container').innerHTML = "";
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getHabits&sheetName=${encodeURIComponent(sheetName)}`);
        const data = await res.json();
        renderHabits(data.habits || []);
      } catch (e) {
        alert("خطا در برقراری ارتباط با گوگل‌شیت");
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function renderHabits(habits) {
      const container = document.getElementById('habits-container');
      container.innerHTML = "";

      const today = 16; // روز جاری ماه (مثلاً ۱۶ شهریور)

      habits.forEach(habit => {
        const isDoneToday = habit.days[today] || false;
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between";
        card.innerHTML = `
          <div>
            <h3 class="font-medium text-sm text-gray-800">${habit.title}</h3>
            <span class="text-xs text-gray-400">هدف ماهانه: ${habit.target} روز</span>
          </div>
          <button onclick="toggleDay('${habit.id}', ${today}, this)" class="w-9 h-9 rounded-full flex items-center justify-center transition-all ${isDoneToday ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-400'}">
            ✓
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function toggleDay(id, day, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "toggleHabitDay",
            sheetName: currentSelectedSheet,
            id: id,
            day: day
          })
        });
        const result = await res.json();
        if (result.success) {
          if (result.newValue) {
            btn.className = "w-9 h-9 rounded-full flex items-center justify-center bg-emerald-500 text-white";
          } else {
            btn.className = "w-9 h-9 rounded-full flex items-center justify-center bg-gray-100 text-gray-400";
          }
        }
      } catch (e) {
        alert("خطا در ذخیره‌سازی");
      } finally {
        btn.disabled = false;
      }
    }

    async function fetchTodos() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('todos-container').innerHTML = "";
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getTodos`);
        const data = await res.json();
        renderTodos(data.todos || []);
      } catch (e) {
        alert("خطا در بارگذاری وظایف");
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function renderTodos(todos) {
      const container = document.getElementById('todos-container');
      container.innerHTML = "";

      todos.forEach(todo => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-start justify-between";
        card.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center space-x-2 space-x-reverse">
              <span class="text-xs">${todo.priority}</span>
              <h3 class="text-sm font-medium ${todo.done ? 'line-through text-gray-400' : 'text-gray-800'}">${todo.title}</h3>
            </div>
            ${todo.description ? `<p class="text-xs text-gray-500">${todo.description}</p>` : ''}
          </div>
          <button onclick="toggleTodo(${todo.row}, this)" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all ${todo.done ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-400'}">
            ✓
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function toggleTodo(row, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "toggleTodo", row: row })
        });
        const result = await res.json();
        if (result.success) {
          fetchTodos();
        }
      } catch (e) {
        alert("خطا در به‌روزرسانی کار");
      } finally {
        btn.disabled = false;
      }
    }

    // لود اولیه
    loadCurrentView();
  </script>
</body>
</html>
